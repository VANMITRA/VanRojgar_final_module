org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Disable Kotlin incremental caches to fix Windows cross-drive (C: vs D:) relativeTo bug
kotlin.incremental=false
kotlin.incremental.useClasspathSnapshot=false
kotlin.incremental.java=false
kotlin.compiler.execution.strategy=in-process

# Ensure Gradle cache stays on D: drive to prevent Windows C: drive permission/lock conflicts
systemProp.gradle.user.home=D:/.gradle
# Ensure Android home (keystores, caches) stays on D: drive to prevent C:\Users\Ayush\.android permission failures
systemProp.android.user.home=D:/.android
