name: Android APK
# Builds a signed release APK (application id in.vanrozgar.app) against the deployed servers.
# Secrets are set in GitHub: Settings, Secrets and variables, Actions. See docs/DEPLOY.md section 5.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    defaults: { run: { working-directory: app } }
    env:
      REQUIRE_RELEASE_KEY: '1'   # Gradle refuses to sign a release with the debug key
    steps:
      - uses: actions/checkout@v4
      - name: Check the required secrets are present
        working-directory: .
        env:
          API_URL: ${{ secrets.API_URL }}
          LIVELIHOOD_API_URL: ${{ secrets.LIVELIHOOD_API_URL }}
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          for v in API_URL LIVELIHOOD_API_URL KEYSTORE STORE_PASS KEY_ALIAS KEY_PASS; do
            if [ -z "${!v}" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then echo "::error::Missing GitHub secrets:$missing"; exit 1; fi
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - name: Make Gradle settings CI friendly
        working-directory: app/android
        run: |
          sed -i '/^systemProp\./d' gradle.properties
          sed -i 's/-Xmx8G/-Xmx4G/; s/MaxMetaspaceSize=4G/MaxMetaspaceSize=1G/' gradle.properties
      - name: Write the release keystore (never committed)
        working-directory: app/android
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 -d > app/upload-keystore.jks
          printf 'storeFile=upload-keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$STORE_PASS" "$KEY_ALIAS" "$KEY_PASS" > key.properties
      - name: Build release APK against the deployed servers
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL=${{ secrets.API_URL }} \
            --dart-define=LIVELIHOOD_API_BASE_URL=${{ secrets.LIVELIHOOD_API_URL }} \
            --dart-define=DEV_TOOLS=${{ vars.DEV_TOOLS || 'false' }} \
            --dart-define=DEMO_PIN=${{ secrets.DEMO_PIN }}
      - uses: actions/upload-artifact@v4
        with: { name: vanrozgar-apk, path: app/build/app/outputs/flutter-apk/app-release.apk }
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with: { files: app/build/app/outputs/flutter-apk/app-release.apk }
