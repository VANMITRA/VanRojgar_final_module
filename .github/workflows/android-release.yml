name: Android APK
on:
  push:
    tags: ['v*']
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - name: Make Gradle settings CI friendly
        working-directory: app/android
        run: |
          sed -i '/^systemProp\./d' gradle.properties
          sed -i 's/-Xmx8G/-Xmx4G/; s/MaxMetaspaceSize=4G/MaxMetaspaceSize=1G/' gradle.properties
          cat gradle.properties
      - name: Build release APK against the deployed API
        run: flutter build apk --release --dart-define=API_BASE_URL=${{ secrets.API_URL || 'http://127.0.0.1:3000/api/v1' }}
      - uses: actions/upload-artifact@v4
        with: { name: vanrozgar-apk, path: app/build/app/outputs/flutter-apk/app-release.apk }
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with: { files: app/build/app/outputs/flutter-apk/app-release.apk }
